name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install measurement deps
        run: python -m pip install numpy pillow
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests (no model, no GPU)
        run: python -m unittest discover -s tests/unit -t . -v
      - name: Validate the example project
        run: python -m hlvs.cli validate examples/minimal-project/project.json
      - name: Doctor (locate only, no probe)
        run: python -m hlvs.cli doctor --no-probe

  integration:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Install measurement deps
        run: python -m pip install numpy pillow
      - name: Integration tests (real ffmpeg, synthetic media)
        run: python -m unittest discover -s tests/integration -t . -v
      - name: Package installs
        run: python -m pip install -e .

# The end-to-end job is deliberately NOT in CI: it needs ~17.8 GB of model
# weights and Apple-Silicon MLX inference. Run it locally with
# scripts/run-project. Claiming it in CI would be claiming a test that cannot run.
